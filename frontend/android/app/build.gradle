apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def resolveSigningValue = { propertyKey, envKey ->
    def propertyValue = keystoreProperties[propertyKey]
    if (propertyValue != null && propertyValue.toString().trim()) {
        return propertyValue.toString().trim()
    }
    def envValue = System.getenv(envKey)
    if (envValue != null && envValue.trim()) {
        return envValue.trim()
    }
    return ''
}
def releaseStoreFilePath = resolveSigningValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def releaseStorePassword = resolveSigningValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = resolveSigningValue('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = resolveSigningValue('keyPassword', 'ANDROID_KEY_PASSWORD')
def releaseStoreType = resolveSigningValue('storeType', 'ANDROID_KEYSTORE_TYPE') ?: 'jks'
def hasReleaseSigningConfig =
        releaseStoreFilePath &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword
def packageJsonText = rootProject.file('../package.json').text
def versionMatcher = (packageJsonText =~ /"version"\s*:\s*"([^"]+)"/)
def packageVersionName = versionMatcher.find() ? versionMatcher.group(1) : "1.0.0"
def ciVersionName = System.getenv("CI_VERSION_NAME")?.trim()
def ciVersionCode = System.getenv("CI_VERSION_CODE")?.trim()
def versionSegmentBase = 1_000
def majorMultiplier = versionSegmentBase * versionSegmentBase
def playStoreVersionCodeOffset = 1_000_000
def maxPlayVersionCode = Integer.MAX_VALUE
def deriveVersionCodeFromVersionName = { versionName, fallbackValue ->
    def normalizedVersionName = (versionName ?: '').trim()
    if (!normalizedVersionName) {
        return fallbackValue
    }

    def versionCore = normalizedVersionName.tokenize('-')[0]
    def versionParts = versionCore.tokenize('.')
    if (versionParts.size() < 3) {
        return fallbackValue
    }

    try {
        def major = Integer.parseInt(versionParts[0])
        def minor = Integer.parseInt(versionParts[1])
        def patch = Integer.parseInt(versionParts[2])
        if (major < 0 || minor < 0 || patch < 0) {
            return fallbackValue
        }
        if (minor >= versionSegmentBase || patch >= versionSegmentBase) {
            return fallbackValue
        }

        def computedVersionCode =
                playStoreVersionCodeOffset +
                (major * majorMultiplier) +
                (minor * versionSegmentBase) +
                patch
        if (computedVersionCode > maxPlayVersionCode) {
            return fallbackValue
        }

        return computedVersionCode
    } catch (NumberFormatException ignored) {
        return fallbackValue
    }
}
def resolveVersionCode = { envValue, fallbackValue ->
    if (envValue == null || !envValue) {
        return fallbackValue
    }
    try {
        return Integer.parseInt(envValue)
    } catch (NumberFormatException ignored) {
        return fallbackValue
    }
}
def appVersionName = ciVersionName ?: packageVersionName
def defaultVersionCode = deriveVersionCodeFromVersionName(appVersionName, playStoreVersionCodeOffset)
def appVersionCode = resolveVersionCode(ciVersionCode, defaultVersionCode)

android {
    namespace = "com.strawcoding.strawmoneybook"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.strawcoding.strawmoneybook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile rootProject.file(releaseStoreFilePath)
                storeType releaseStoreType
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix "debug"
            if (hasReleaseSigningConfig) {
                signingConfig = signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig = signingConfigs.release
            }
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    implementation "androidx.sqlite:sqlite:2.4.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    testImplementation "androidx.sqlite:sqlite-framework:2.4.0"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.sqlite:sqlite-framework:2.4.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
