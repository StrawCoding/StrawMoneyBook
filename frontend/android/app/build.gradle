apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def resolveSigningValue = { propertyKey, envKey ->
    def propertyValue = keystoreProperties[propertyKey]
    if (propertyValue != null && propertyValue.toString().trim()) {
        return propertyValue.toString().trim()
    }
    def envValue = System.getenv(envKey)
    if (envValue != null && envValue.trim()) {
        return envValue.trim()
    }
    return ''
}
def releaseStoreFilePath = resolveSigningValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def releaseStorePassword = resolveSigningValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = resolveSigningValue('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = resolveSigningValue('keyPassword', 'ANDROID_KEY_PASSWORD')
def hasReleaseSigningConfig =
        releaseStoreFilePath &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword
def packageJsonText = rootProject.file('../package.json').text
def versionMatcher = (packageJsonText =~ /"version"\s*:\s*"([^"]+)"/)
def packageVersionName = versionMatcher.find() ? versionMatcher.group(1) : "1.0.0"
def ciVersionName = System.getenv("CI_VERSION_NAME")?.trim()
def ciVersionCode = System.getenv("CI_VERSION_CODE")?.trim()
def resolveVersionCode = { envValue, fallbackValue ->
    if (envValue == null || !envValue) {
        return fallbackValue
    }
    try {
        return Integer.parseInt(envValue)
    } catch (NumberFormatException ignored) {
        return fallbackValue
    }
}
def appVersionName = ciVersionName ?: packageVersionName
def appVersionCode = resolveVersionCode(ciVersionCode, 186)

android {
    namespace = "com.strawcoding.strawmoneybook"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.strawcoding.strawmoneybook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix "debug"
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "cz.adaptech.tesseract4android:tesseract4android-openmp:4.9.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
