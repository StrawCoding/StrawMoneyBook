name: Play Closed Testing Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-release:
    if: ${{ !endsWith(github.ref_name, '.0') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_VERSION: "22"
      JAVA_VERSION: "21"
      RUBY_VERSION: "3.3"
      AAB_PATH: app/build/outputs/bundle/release/app-release.aab
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      # Track pair comes from frontend/android/play-testing-channel.json (internal|closed).
      # Optional overrides: PLAY_TESTING_CHANNEL, PLAY_CLOSED_TESTING_TRACK, PLAY_WEAR_CLOSED_TESTING_TRACK.
      PLAY_TESTING_CHANNEL: ${{ vars.PLAY_TESTING_CHANNEL || '' }}
      PLAY_CLOSED_TESTING_TRACK: ${{ vars.PLAY_CLOSED_TESTING_TRACK || '' }}
      PLAY_WEAR_CLOSED_TESTING_TRACK: ${{ vars.PLAY_WEAR_CLOSED_TESTING_TRACK || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: frontend/android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        run: npm run build:web

      - name: Prepare Capacitor Android release files
        working-directory: frontend
        run: npm run prepare:android:release

      - name: Prepare release paths
        run: |
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"

      - name: Compute Android version name from tag
        run: |
          echo "CI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release AABs (phone + wear)
        working-directory: frontend/android
        run: ./gradlew :app:bundleRelease :wear:bundleRelease --configuration-cache --build-cache

      - name: Resolve built AAB paths
        working-directory: frontend/android
        run: |
          RESOLVED_AAB_PATH="$(find "$PWD/app/build/outputs/bundle" -type f -name '*.aab' | sort | tail -n 1)"
          if [ -z "$RESOLVED_AAB_PATH" ]; then
            echo "Unable to find built AAB under frontend/android/app/build/outputs/bundle" >&2
            find app/build/outputs -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi
          echo "AAB_PATH=$RESOLVED_AAB_PATH" >> "$GITHUB_ENV"

          RESOLVED_WEAR_AAB="$(find "$PWD/wear/build/outputs/bundle" -type f -name '*.aab' | sort | tail -n 1 || true)"
          if [ -z "$RESOLVED_WEAR_AAB" ]; then
            echo "Unable to find Wear AAB under frontend/android/wear/build/outputs/bundle" >&2
            find wear/build/outputs -maxdepth 5 -type f | sort >&2 || true
            exit 1
          fi
          echo "WEAR_AAB_PATH=$RESOLVED_WEAR_AAB" >> "$GITHUB_ENV"

      - name: Resolve Play deobfuscation mapping path
        working-directory: frontend/android
        run: |
          RESOLVED_MAPPING_PATH="$(find "$PWD/app/build/outputs/mapping" -type f -name 'mapping.txt' | sort | tail -n 1)"
          if [ -n "$RESOLVED_MAPPING_PATH" ]; then
            echo "PLAY_MAPPING_PATH=$RESOLVED_MAPPING_PATH" >> "$GITHUB_ENV"
          fi

      - name: Prepare GitHub Release body
        run: |
          NOTES_FILE="release-notes.pending.md"
          RELEASE_BODY_PATH="${{ runner.temp }}/github-release-body.md"
          printf '' > "$RELEASE_BODY_PATH"
          if [ -f "$NOTES_FILE" ]; then
            CONTENT=$(awk 'BEGIN{p=1} /^---$/{p=0} p && !/^#/ && !/^[[:space:]]*$/{print}' "$NOTES_FILE" || true)
            if [ -n "$CONTENT" ]; then
              printf '## 版本變更\n\n%s\n' "$CONTENT" > "$RELEASE_BODY_PATH"
            fi
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/github-release-body.md
          generate_release_notes: true
          files: |
            ${{ env.AAB_PATH }}
            ${{ env.WEAR_AAB_PATH }}
            ${{ env.PLAY_MAPPING_PATH }}

      - name: Prepare Play upload paths
        run: |
          echo "PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"

      - name: Restore Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_PATH"

      - name: Publish to Google Play testing tracks
        working-directory: frontend/android
        run: bundle exec fastlane closed_testing
