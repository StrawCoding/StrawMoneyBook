name: Play Internal Release

on:
  push:
    tags:
      - "v*"

jobs:
  play-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AAB_PATH: app/build/outputs/bundle/release/app-release.aab
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: frontend/android

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        run: npm run build:web

      - name: Prepare Capacitor Android release files
        working-directory: frontend
        run: npm run prepare:android:release

      - name: Prepare release paths
        run: |
          echo "PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Restore Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_PATH"

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"

      - name: Compute Android version from tag
        run: |
          echo "CI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "CI_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Resolve built AAB path
        working-directory: frontend/android
        run: |
          RESOLVED_AAB_PATH="$(find "$PWD/app/build/outputs/bundle" -type f -name '*.aab' | sort | tail -n 1)"
          if [ -z "$RESOLVED_AAB_PATH" ]; then
            echo "Unable to find built AAB under frontend/android/app/build/outputs/bundle" >&2
            find app/build/outputs -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi
          echo "AAB_PATH=$RESOLVED_AAB_PATH" >> "$GITHUB_ENV"

      - name: Upload to Google Play internal
        working-directory: frontend/android
        run: bundle exec fastlane internal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.AAB_PATH }}
