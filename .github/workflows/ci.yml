name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: npm ci
      - run: npm run check
      - name: Validate release notes pending file exists
        run: test -f ../release-notes.pending.md || (echo "release-notes.pending.md is missing from repo root" && exit 1)
      - name: Validate release version matches latest git tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release:sync-check
      - name: Prepare Android release files for cache warmup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run prepare:android:release
      - name: Warm Android bundleRelease cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend/android
        run: ./gradlew :app:bundleRelease :wear:bundleRelease --dry-run --configuration-cache --build-cache
