name: Play Closed Testing Release From GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag / release tag to upload to Google Play
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name }}
  cancel-in-progress: true

jobs:
  play-release-from-github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUBY_VERSION: "3.2"
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      PLAY_CLOSED_TESTING_TRACK: ${{ vars.PLAY_CLOSED_TESTING_TRACK || 'alpha' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: frontend/android

      - name: Prepare release paths
        run: |
          echo "PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_DIR=$RUNNER_TEMP/github-release-assets" >> "$GITHUB_ENV"

      - name: Restore Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_PATH"

      - name: Download AAB from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RELEASE_ASSET_DIR"
          gh release download "${{ inputs.tag_name }}" --pattern "*.aab" --dir "$RELEASE_ASSET_DIR" --clobber
          gh release download "${{ inputs.tag_name }}" --pattern "mapping.txt" --dir "$RELEASE_ASSET_DIR" --clobber || true
          RESOLVED_AAB_PATH="$(find "$RELEASE_ASSET_DIR" -maxdepth 1 -type f -name '*.aab' | sort | tail -n 1)"
          if [ -z "$RESOLVED_AAB_PATH" ]; then
            echo "Unable to find downloaded AAB asset for release ${{ inputs.tag_name }}" >&2
            find "$RELEASE_ASSET_DIR" -maxdepth 2 -type f | sort >&2 || true
            exit 1
          fi
          RESOLVED_MAPPING_PATH="$(find "$RELEASE_ASSET_DIR" -maxdepth 1 -type f -name 'mapping.txt' | sort | tail -n 1)"
          echo "AAB_PATH=$RESOLVED_AAB_PATH" >> "$GITHUB_ENV"
          if [ -n "$RESOLVED_MAPPING_PATH" ]; then
            echo "PLAY_MAPPING_PATH=$RESOLVED_MAPPING_PATH" >> "$GITHUB_ENV"
          fi

      - name: Publish to Google Play closed testing
        working-directory: frontend/android
        run: bundle exec fastlane closed_testing
